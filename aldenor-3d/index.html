<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chroniques d'Aldenor 3D</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚔️</text></svg>">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a12; }
    #app { display: block; width: 100%; height: 100%; }

    /* L'UI vit en DOM par-dessus le canvas WebGL (jamais en 3D) */
    #ui-root {
      position: fixed; inset: 0;
      pointer-events: none; /* les éléments interactifs réactivent pointer-events eux-mêmes */
      font-family: 'Segoe UI', system-ui, sans-serif;
      color: #e8dcc0;
    }

    /* Écran de chargement */
    #loading {
      position: fixed; inset: 0; z-index: 100;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
      background: radial-gradient(ellipse at 50% 35%, #232030 0%, #0a0a12 75%);
      transition: opacity .4s ease;
    }
    #loading.done { opacity: 0; pointer-events: none; }
    #loading h1 { color: #e8c860; letter-spacing: 6px; font-size: 28px; font-weight: 600; }
    #loading .sub { color: #8a8070; letter-spacing: 2px; font-size: 13px; }
    #loading-bar-track {
      width: min(420px, 70vw); height: 8px;
      background: #1a1622; border: 1px solid #4a4058; border-radius: 4px; overflow: hidden;
    }
    #loading-bar { width: 0%; height: 100%; background: linear-gradient(90deg, #b08a3a, #e8c860); transition: width .2s; }
    #loading-status { color: #6a6258; font-size: 12px; min-height: 1em; }

    /* Compteur FPS de debug */
    #fps {
      position: fixed; top: 8px; left: 8px; z-index: 50;
      font: 12px/1.4 monospace; color: #80c880;
      background: rgba(10, 10, 18, .6); padding: 3px 8px; border-radius: 3px;
    }
    #info {
      position: fixed; top: 34px; left: 8px; z-index: 50;
      font: 11px/1.4 monospace; color: #c8bfa0;
      background: rgba(10, 10, 18, .55); padding: 2px 8px; border-radius: 3px;
    }
    #hint {
      position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%); z-index: 50;
      font: 11px/1.4 monospace; color: #b0a890;
      background: rgba(10, 10, 18, .55); padding: 3px 10px; border-radius: 3px;
      white-space: nowrap;
    }
    #pv-wrap {
      position: fixed; bottom: 64px; left: 50%; transform: translateX(-50%); z-index: 50;
      width: 260px; height: 10px; background: rgba(10, 10, 18, .6);
      border-radius: 5px; padding: 1px;
    }
    #pv { width: 100%; height: 100%; border-radius: 4px;
      background: linear-gradient(90deg, #e05648, #ff8a60); transition: width .12s; }
    #energie-wrap {
      position: fixed; bottom: 54px; left: 50%; transform: translateX(-50%); z-index: 50;
      width: 260px; height: 5px; background: rgba(10, 10, 18, .6);
      border-radius: 3px; padding: 1px;
    }
    #energie { width: 0%; height: 100%; border-radius: 2px;
      background: linear-gradient(90deg, #d8a830, #ffe27a); transition: width .15s; }
    #energie.pleine { animation: pulseor 0.9s infinite alternate; }
    @keyframes pulseor { from { filter: brightness(1); } to { filter: brightness(1.7); } }
    #stamina-wrap {
      position: fixed; bottom: 42px; left: 50%; transform: translateX(-50%); z-index: 50;
      width: 220px; height: 7px; background: rgba(10, 10, 18, .55);
      border-radius: 4px; padding: 1px; opacity: 0; transition: opacity .3s;
    }
    #stamina {
      width: 100%; height: 100%; border-radius: 3px;
      background: linear-gradient(90deg, #6ac46a, #b8e86a); transition: width .1s;
    }
    #charge-wrap {
      position: fixed; bottom: 82px; left: 50%; transform: translateX(-50%); z-index: 50;
      width: 160px; height: 8px; background: rgba(10, 10, 18, .65);
      border-radius: 4px; padding: 1px; display: none;
    }
    #charge { width: 0%; height: 100%; border-radius: 3px;
      background: linear-gradient(90deg, #e8a030, #ff5a30); }
    #skill-box, #ult-box {
      position: fixed; right: 18px; z-index: 50;
      display: flex; align-items: center; gap: 7px;
      font: 12px/1.3 monospace; color: #d8d0b8;
      background: rgba(10, 10, 18, .6); padding: 6px 10px; border-radius: 5px;
    }
    #skill-box { bottom: 58px; }
    #ult-box { bottom: 18px; opacity: .45; }
    #ult-box.pret { opacity: 1; box-shadow: 0 0 12px #ffd24a80; color: #ffe27a; }
    .kbd {
      display: inline-block; min-width: 18px; text-align: center;
      border: 1px solid #6a6252; border-radius: 4px; padding: 1px 4px;
      font-weight: bold; color: #ffe9b0; background: #201c14;
    }
    #skill-cd { color: #8a8270; min-width: 34px; text-align: right; }
    #target-wrap {
      position: fixed; top: 14px; left: 50%; transform: translateX(-50%); z-index: 50;
      text-align: center; display: none;
    }
    #target-nom { font: bold 13px monospace; color: #ffd8c0; text-shadow: 1px 1px 0 #000; margin-bottom: 3px; }
    #target-bar-wrap { width: 260px; height: 7px; background: rgba(10,10,18,.65); border-radius: 4px; padding: 1px; }
    #target-bar { width: 100%; height: 100%; border-radius: 3px; background: linear-gradient(90deg, #c03a3a, #ff7a50); transition: width .1s; }
    #reticle {
      position: fixed; z-index: 55; display: none; pointer-events: none;
      width: 26px; height: 26px; margin: -13px 0 0 -13px;
      border: 2px solid #ffd24a; border-radius: 50%;
      box-shadow: 0 0 8px #ffd24a90, inset 0 0 5px #ffd24a60;
      animation: retpulse 1s infinite alternate;
    }
    @keyframes retpulse { from { transform: scale(1); } to { transform: scale(1.15); } }
    #dmg-root { position: fixed; inset: 0; z-index: 54; pointer-events: none; overflow: hidden; }
    .dmg {
      position: absolute; transform: translate(-50%, -50%);
      font: bold 17px monospace; text-shadow: 2px 2px 0 #000;
      opacity: 1; transition: transform .85s ease-out, opacity .85s;
      white-space: nowrap;
    }
    .dmg.gros { font-size: 24px; }
    .dmg.go { transform: translate(-50%, calc(-50% - 54px)); opacity: 0; }
    #annonce {
      position: fixed; top: 20%; left: 50%; transform: translateX(-50%); z-index: 60;
      font: bold 16px monospace; color: #ffe9b0; text-shadow: 2px 2px 0 #000;
      background: rgba(10,10,18,.7); padding: 6px 16px; border-radius: 6px;
      opacity: 0; transition: opacity .25s; pointer-events: none;
    }
    #annonce.on { opacity: 1; }

    /* ---- Phase 5 : PNJ / dialogue / quêtes ---- */
    #interact-prompt {
      position: fixed; z-index: 56; display: none; align-items: center; gap: 6px;
      transform: translate(-50%, -50%); pointer-events: none;
      font: 12px/1 monospace; color: #f0e6c8; text-shadow: 1px 1px 2px #000;
    }
    #interact-prompt .key {
      display: inline-block; min-width: 20px; text-align: center;
      border: 2px solid #ffd24a; border-radius: 5px; padding: 2px 5px;
      font-weight: bold; color: #ffe9b0; background: rgba(20,16,10,.85);
      box-shadow: 0 0 8px #ffd24a70;
    }
    #interact-prompt .who { background: rgba(10,10,18,.7); padding: 2px 7px; border-radius: 4px; }

    #obj-marker {
      position: fixed; z-index: 53; display: none; transform: translate(-50%, -50%);
      pointer-events: none; text-align: center; color: #ffd24a;
      text-shadow: 0 0 6px #ffd24a90, 1px 1px 2px #000;
    }
    #obj-marker .ico { font-size: 20px; display: block; animation: objb 1.1s infinite alternate; }
    #obj-marker .d { font: 10px monospace; color: #ffe9b0; }
    @keyframes objb { from { transform: translateY(0); } to { transform: translateY(-5px); } }

    #quest-track {
      position: fixed; top: 62px; right: 16px; z-index: 50; max-width: 280px;
      background: rgba(10,10,18,.55); border-left: 3px solid #ffd24a;
      padding: 7px 12px; border-radius: 3px; opacity: 0; transition: opacity .3s;
    }
    #quest-track.on { opacity: 1; }
    #quest-track .t-tit { font: bold 13px monospace; color: #ffe9b0; margin-bottom: 3px; }
    #quest-track .t-obj { font: 12px monospace; color: #c8d0b8; }

    #toasts {
      position: fixed; bottom: 108px; left: 16px; z-index: 57; pointer-events: none;
      display: flex; flex-direction: column; gap: 5px;
    }
    .toast {
      background: rgba(10,10,18,.82); border-left: 3px solid #8aa0c8;
      padding: 6px 12px; font: 12px monospace; color: #e8e0cc; border-radius: 3px;
      opacity: 0; transform: translateX(-18px); transition: opacity .3s, transform .3s;
    }
    .toast.on { opacity: 1; transform: translateX(0); }
    .toast.quete { border-left-color: #ffd24a; color: #ffe9b0; }

    #journal {
      position: fixed; inset: 0; z-index: 70; display: none;
      background: rgba(6,6,12,.82); padding: 5vh 0; overflow-y: auto;
    }
    #journal.on { display: block; }
    .j-head {
      max-width: 640px; margin: 0 auto 14px; padding: 0 20px;
      font: bold 22px Georgia, serif; color: #ffe9b0; letter-spacing: 2px;
      display: flex; justify-content: space-between; align-items: baseline;
    }
    .j-head .j-close { font: 11px monospace; color: #8a8270; letter-spacing: 0; }
    #journal-list { max-width: 640px; margin: 0 auto; padding: 0 20px; }
    #journal-list .vide { color: #8a8270; font: 14px monospace; text-align: center; padding: 40px; }
    .q {
      background: rgba(24,20,14,.7); border: 1px solid #4a4030; border-radius: 6px;
      padding: 12px 16px; margin-bottom: 10px;
    }
    .q.fini { opacity: .55; }
    .q-tit { font: bold 15px Georgia, serif; color: #ffe9b0; margin-bottom: 4px; }
    .q-res { font: 12px/1.4 monospace; color: #a89e88; margin-bottom: 6px; }
    .q-obj { list-style: none; font: 12px/1.6 monospace; color: #c8d0b8; }
    .q-obj li.ok { color: #7ec86a; text-decoration: line-through; }
    .tag { font: 10px monospace; padding: 1px 7px; border-radius: 8px; margin-left: 6px; vertical-align: middle; }
    .tag.princ { background: #6a4a10; color: #ffd24a; }
    .tag.annexe { background: #2a3a5a; color: #a8c0e8; }
    .tag.rendu { background: #6a1a1a; color: #ff9a7a; }
    .tag.fini { background: #2a4a2a; color: #8ad86a; }

    #dialogue {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 65; display: none;
      background: linear-gradient(transparent, rgba(6,6,12,.9) 30%);
      padding: 30px 0 24px;
    }
    #dialogue.on { display: block; }
    #dlg-nom {
      max-width: 700px; margin: 0 auto 6px; padding: 0 24px;
      font: bold 16px Georgia, serif; color: #ffd24a; text-shadow: 1px 1px 2px #000;
    }
    #dlg-texte {
      max-width: 700px; margin: 0 auto 12px; padding: 12px 24px;
      font: 14px/1.55 Georgia, serif; color: #f0e8d4; white-space: pre-line;
      background: rgba(16,14,10,.7); border-radius: 8px; border: 1px solid #4a4030;
    }
    #dlg-choix { max-width: 700px; margin: 0 auto; padding: 0 24px; display: flex; flex-direction: column; gap: 6px; }
    .dlg-choix {
      pointer-events: auto; text-align: left; cursor: pointer;
      background: rgba(30,26,18,.85); border: 1px solid #5a4e38; border-radius: 6px;
      padding: 9px 14px; font: 13px monospace; color: #e0d8c0; transition: all .12s;
    }
    .dlg-choix:hover { background: rgba(60,50,30,.95); border-color: #ffd24a; color: #fff; transform: translateX(3px); }
  </style>
</head>
<body>
  <canvas id="app"></canvas>

  <div id="ui-root">
    <div id="fps"></div>
    <div id="info"></div>
    <div id="pv-wrap"><div id="pv"></div></div>
    <div id="energie-wrap"><div id="energie"></div></div>
    <div id="stamina-wrap"><div id="stamina"></div></div>
    <div id="charge-wrap"><div id="charge"></div></div>
    <div id="skill-box"><span class="kbd">E</span><span id="skill-nom"></span><span id="skill-cd"></span></div>
    <div id="ult-box"><span class="kbd">R</span><span id="ult-etat"></span></div>
    <div id="target-wrap"><div id="target-nom"></div><div id="target-bar-wrap"><div id="target-bar"></div></div></div>
    <div id="reticle"></div>
    <div id="dmg-root"></div>
    <div id="annonce"></div>

    <!-- Phase 5 : PNJ, dialogues, quêtes -->
    <div id="interact-prompt"><span class="key">F</span><span class="who"></span></div>
    <div id="obj-marker"><span class="ico">◈</span><span class="d"></span></div>
    <div id="quest-track"></div>
    <div id="toasts"></div>
    <div id="journal">
      <div class="j-head">Journal de quêtes <span class="j-close">J pour fermer</span></div>
      <div id="journal-list"></div>
    </div>
    <div id="dialogue">
      <div id="dlg-nom"></div>
      <div id="dlg-texte"></div>
      <div id="dlg-choix"></div>
    </div>

    <div id="hint">ZQSD · Maj sprint · Espace saut · Clic G/D attaques · Ctrl esquive · E compétence · R ultime · Tab lock-on · <b>F parler · J journal</b></div>
  </div>

  <div id="loading">
    <h1>CHRONIQUES D'ALDENOR</h1>
    <div class="sub">— PHASE 1 : FONDATIONS 3D —</div>
    <div id="loading-bar-track"><div id="loading-bar"></div></div>
    <div id="loading-status">Initialisation…</div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
